<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vet Ward: Anomaly</title>
    <style>
        :root {
            --crt-green: #33ff33;
            --bg-dark: #0a0a0a;
        }

        body, html {
            margin: 0;
            padding: 0;
            background-color: black;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            height: 100%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- UI Screens --- */
        .screen {
            display: none;
            width: 100%;
            max-width: 800px;
            height: 600px;
            border: 2px solid #333;
            background-color: var(--bg-dark);
            position: relative;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }

        .active {
            display: flex;
            flex-direction: column;
        }

        h1 { text-align: center; color: darkred; text-shadow: 2px 2px 5px red; }
        
        /* --- Main Menu & Multiplayer --- */
        .menu-container { padding: 50px; text-align: center; }
        input[type="text"] {
            padding: 10px; font-size: 16px; background: #222; color: white;
            border: 1px solid #555; text-align: center; margin: 10px 0;
        }
        button {
            padding: 10px 20px; font-size: 18px; margin: 10px; cursor: pointer;
            background-color: #333; color: white; border: 1px solid white;
            transition: 0.2s;
        }
        button:hover { background-color: white; color: black; }

        /* --- Game View --- */
        .camera-feed {
            flex-grow: 1;
            position: relative;
            background: #111;
            border-bottom: 2px solid #444;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .crt-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
            pointer-events: none; z-index: 10;
        }

        .cam-text {
            position: absolute; top: 10px; left: 10px; color: var(--crt-green); z-index: 11;
        }

        /* --- The Patient (Animal) --- */
        .patient {
            font-size: 100px;
            transition: all 0.3s ease;
        }

        /* --- Anomalies --- */
        .anomaly-flicker { animation: flicker 0.5s infinite; }
        @keyframes flicker {
            0% { opacity: 1; background-color: #111; }
            50% { opacity: 0.1; background-color: black; }
            100% { opacity: 1; background-color: #300; }
        }

        .anomaly-twitch { animation: twitch 0.1s infinite; }
        @keyframes twitch {
            0% { transform: translate(0, 0); }
            25% { transform: translate(-5px, 5px); }
            50% { transform: translate(5px, -5px); }
            75% { transform: translate(-5px, -5px); }
            100% { transform: translate(5px, 5px); }
        }

        /* --- Controls --- */
        .controls {
            height: 100px; display: flex; justify-content: space-around; align-items: center;
            background: #050505;
        }
        
        .shutter-btn {
            background-color: darkred; border-color: red; font-weight: bold; font-size: 24px;
        }
        .shutter-btn:hover { background-color: red; }

        /* --- Shutter Animation --- */
        .shutter {
            position: absolute; top: -100%; left: 0; width: 100%; height: 100%;
            background: #222; border-bottom: 10px solid #555;
            transition: top 0.2s ease-in-out; z-index: 20;
        }
        .shutter.closed { top: 0; }

    </style>
</head>
<body>

    <div id="menuScreen" class="screen active">
        <div class="menu-container">
            <h1>WARD 4: ANOMALY</h1>
            <p>Treat the normal animals. Close the shutter on the unnatural.</p>
            
            <hr>
            <h3>Multiplayer Lobby</h3>
            <input type="text" id="roomCode" placeholder="Enter Room Code" maxlength="6">
            <br>
            <button onclick="joinGame()">Join / Host Game</button>
            <hr>
            <button onclick="openShop()">Item Shop</button>
        </div>
    </div>

    <div id="shopScreen" class="screen">
        <div class="menu-container">
            <h1>SHOP</h1>
            <p>Credits: <span id="creditsDisplay">0</span></p>
            <button onclick="buyItem('camera_upgrade')">Better Camera (50 CR)</button>
            <button onclick="buyItem('treats')">Animal Treats (20 CR)</button>
            <br><br>
            <button onclick="showScreen('menuScreen')">Back to Menu</button>
        </div>
    </div>

    <div id="gameScreen" class="screen">
        <div class="camera-feed" id="camFeed">
            <div class="crt-overlay"></div>
            <div class="cam-text">CAM 01 - RECOVERY WARD <br><span id="statusText">STATUS: NORMAL</span></div>
            
            <div class="patient" id="patientEmoji">🐶</div>
            <div class="shutter" id="shutterElement"></div>
        </div>
        
        <div class="controls">
            <button onclick="checkCamera()">Check Photos/Cameras</button>
            <button class="shutter-btn" onmousedown="toggleShutter(true)" onmouseup="toggleShutter(false)">HOLD SHUTTER</button>
        </div>
    </div>

    <script>
        // Game State Variables
        let credits = 0;
        let isAnomalyActive = false;
        let anomalyTimer;
        let gameLoop;
        let patient = document.getElementById("patientEmoji");
        let camFeed = document.getElementById("camFeed");

        // Normal faces vs Anomaly faces
        const normalFaces = ["🐶", "🐱", "🐰"];
        const anomalyFaces = ["🐺", "👹", "💀", "👁️"];

        // Navigation
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function openShop() {
            document.getElementById('creditsDisplay').innerText = credits;
            showScreen('shopScreen');
        }

        function buyItem(item) {
            alert("Shop backend not connected. This would deduct credits and give you an item!");
        }

        function joinGame() {
            let code = document.getElementById('roomCode').value;
            if(!code) code = "SOLO";
            alert("Connecting to server room: " + code + "... (Simulated)");
            startGame();
        }

        // Gameplay Logic
        function startGame() {
            showScreen('gameScreen');
            resetPatient();
            startGameLoop();
        }

        function resetPatient() {
            isAnomalyActive = false;
            patient.className = "patient";
            camFeed.classList.remove("anomaly-flicker");
            patient.innerText = normalFaces[Math.floor(Math.random() * normalFaces.length)];
            document.getElementById('statusText').innerText = "STATUS: MONITORING...";
            document.getElementById('statusText').style.color = "var(--crt-green)";
        }

        function startGameLoop() {
            // Randomly trigger an anomaly every 3 to 8 seconds
            let randomDelay = Math.floor(Math.random() * 5000) + 3000;
            gameLoop = setTimeout(triggerAnomaly, randomDelay);
        }

        function triggerAnomaly() {
            if (isAnomalyActive) return; // Prevent overlapping anomalies
            
            isAnomalyActive = true;
            document.getElementById('statusText').innerText = "STATUS: UNKNOWN";
            
            // Pick a random anomaly type
            let type = Math.floor(Math.random() * 3);
            
            if (type === 0) {
                // Wrong Face Anomaly
                patient.innerText = anomalyFaces[Math.floor(Math.random() * anomalyFaces.length)];
            } else if (type === 1) {
                // Twitching Anomaly
                patient.classList.add("anomaly-twitch");
            } else {
                // Lighting/Flicker Anomaly
                camFeed.classList.add("anomaly-flicker");
            }

            // You have 3 seconds to react before it attacks
            anomalyTimer = setTimeout(jumpscare, 3000);
        }

        // Shutter Mechanic
        function toggleShutter(isClosed) {
            const shutter = document.getElementById("shutterElement");
            if (isClosed) {
                shutter.classList.add("closed");
                checkSurvival();
            } else {
                shutter.classList.remove("closed");
            }
        }

        function checkSurvival() {
            if (isAnomalyActive) {
                // Successfully blocked the anomaly
                clearTimeout(anomalyTimer);
                credits += 10;
                document.getElementById('statusText').innerText = "ANOMALY PURGED. +10 CR";
                document.getElementById('statusText').style.color = "yellow";
                
                setTimeout(() => {
                    resetPatient();
                    startGameLoop();
                }, 1500);
            }
        }

        function jumpscare() {
            const shutter = document.getElementById("shutterElement");
            if (!shutter.classList.contains("closed")) {
                alert("GAME OVER! The anomaly got you.");
                clearTimeout(gameLoop);
                showScreen('menuScreen');
            }
        }

        function checkCamera() {
            alert("Checking logs... The animal seems restless.");
        }
    </script>
</body>
</html>
