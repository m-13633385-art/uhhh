<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vet Ward: Anomaly - Full System</title>
    <style>
        /* --- CORE STYLES --- */
        :root {
            --crt-green: #2fff00;
            --crt-dark: #0f3300;
            --bg-color: #030303;
            --panel-bg: #111;
        }

        body, html {
            margin: 0; padding: 0; background-color: var(--bg-color); color: white;
            font-family: 'Courier New', Courier, monospace; user-select: none;
            height: 100%; display: flex; justify-content: center; align-items: center;
        }

        .screen { display: none; width: 100%; max-width: 1000px; height: 700px; position: relative; }
        .active { display: flex; flex-direction: column; }

        /* --- MENUS --- */
        .menu-wrapper {
            background: #0a0a0a; border: 2px solid #333; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        h1 { color: red; font-size: 40px; letter-spacing: 5px; text-shadow: 0 0 10px darkred; }
        .menu-box { background: var(--panel-bg); padding: 30px; border: 1px solid #444; width: 400px; text-align: center; }
        
        button {
            background: #222; color: white; border: 1px solid #555; padding: 12px 20px;
            font-size: 16px; font-weight: bold; cursor: pointer; margin: 10px 0; width: 100%; transition: 0.3s;
        }
        button:hover { background: white; color: black; box-shadow: 0 0 10px white; }
        button:disabled { background: #111; color: #444; border-color: #222; cursor: not-allowed; box-shadow: none; }

        /* --- IN-GAME HUD --- */
        .game-container {
            display: grid; grid-template-columns: 3fr 1fr; grid-template-rows: auto 1fr;
            width: 100%; height: 100%; background: #000; border: 4px solid #222; gap: 5px;
        }

        .header-bar {
            grid-column: 1 / 3; background: #111; border-bottom: 2px solid #333;
            display: flex; justify-content: space-between; padding: 15px 30px; font-size: 20px;
            color: var(--crt-green); text-shadow: 0 0 5px var(--crt-green);
        }

        /* --- CAMERA FEED --- */
        .camera-section {
            position: relative; background: #050505; border: 2px solid #333;
            display: flex; justify-content: center; align-items: center; overflow: hidden;
        }

        .crt-effect {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px; z-index: 10; pointer-events: none;
        }

        .cam-label { position: absolute; top: 15px; left: 15px; z-index: 11; font-size: 24px; color: white; font-weight: bold; }
        .record-dot { color: red; animation: blink 1s infinite; }

        /* --- PATIENTS & ANOMALIES --- */
        .patient-display { font-size: 150px; position: relative; z-index: 5; transition: 0.2s; }
        
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
        @keyframes twitch {
            0% { transform: translate(0, 0); } 20% { transform: translate(-15px, 10px) rotate(5deg); }
            40% { transform: translate(15px, -15px) rotate(-5deg); } 60% { transform: translate(-10px, -10px); }
            80% { transform: translate(10px, 15px) rotate(3deg); } 100% { transform: translate(0, 0); }
        }
        @keyframes flicker {
            0% { background: #050505; } 10% { background: #222; } 20% { background: #000; }
            30% { background: #300; } 100% { background: #050505; }
        }

        .anim-twitch { animation: twitch 0.15s infinite; filter: contrast(200%) grayscale(50%); }
        .anim-flicker { animation: flicker 0.3s infinite; }

        /* --- CONTROL PANEL --- */
        .control-panel {
            background: #111; border-left: 2px solid #333; padding: 20px; display: flex; flex-direction: column;
        }

        .cam-buttons { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .cam-btn { width: 48%; padding: 15px 0; font-size: 18px; }
        .cam-btn.active-cam { background: var(--crt-green); color: black; font-weight: bold; }

        .action-btn { font-size: 20px; padding: 20px; margin-bottom: 10px; border: 2px solid; }
        .btn-treat { border-color: #00ff00; color: #00ff00; }
        .btn-treat:hover { background: #00ff00; color: black; }
        .btn-shut { border-color: red; color: red; }
        .btn-shut:hover { background: red; color: white; }

        .ref-photo {
            margin-top: auto; padding: 15px; background: #000; border: 1px solid #444;
            text-align: center; color: #aaa; font-size: 14px;
        }
        .ref-emoji { font-size: 50px; margin-top: 10px; filter: grayscale(100%); }

        /* --- SHUTTER DOOR --- */
        .shutter-door {
            position: absolute; top: -100%; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(0deg, #111, #111 20px, #000 20px, #000 40px);
            border-bottom: 30px solid #333; z-index: 20; transition: top 0.2s cubic-bezier(0.1, 0.9, 0.2, 1);
        }
        .shutter-door.closed { top: 0; }
        
        .sys-msg { position: absolute; z-index: 30; font-size: 30px; font-weight: bold; display: none; }

        /* --- MULTIPLAYER MOCK --- */
        .multiplayer-box { margin-top: 20px; padding: 15px; border: 1px dashed #555; background: #000; }
        input[type="text"] { width: 80%; padding: 10px; background: #222; color: white; border: 1px solid #555; text-align: center; }

    </style>
</head>
<body>

    <div id="mainMenu" class="screen active">
        <div class="menu-wrapper">
            <h1>ANOMALY: VET WARD</h1>
            <div class="menu-box">
                <button onclick="switchScreen('shopMenu')">ENTER SHOP</button>
                <div class="multiplayer-box">
                    <h3>SERVER CONNECTION</h3>
                    <input type="text" id="serverCode" placeholder="Enter Room Code (Simulated)">
                    <button onclick="startGame()">CONNECT & START NIGHT</button>
                </div>
            </div>
        </div>
    </div>

    <div id="shopMenu" class="screen">
        <div class="menu-wrapper">
            <h1 style="color: gold;">SUPPLY CLOSET</h1>
            <div class="menu-box">
                <h3 style="color: var(--crt-green)">Available Credits: <span id="shopCredits">0</span> CR</h3>
                <hr style="border-color: #333;">
                <button id="btnBuyScanner" onclick="buyItem('scanner', 50)">Buy Auto-Scanner (50 CR)</button>
                <button id="btnBuyBattery" onclick="buyItem('battery', 100)">Buy Backup Battery (100 CR)</button>
                <p id="shopMsg" style="color: #aaa;"></p>
                <button onclick="switchScreen('mainMenu')" style="margin-top: 30px;">BACK TO MENU</button>
            </div>
        </div>
    </div>

    <div id="gameScreen" class="screen">
        <div class="game-container">
            
            <div class="header-bar">
                <span id="hudNight">NIGHT: 1</span>
                <span id="hudTime">12:00 AM</span>
                <span id="hudCredits">CREDITS: 0 CR</span>
            </div>

            <div class="camera-section" id="camView">
                <div class="crt-effect"></div>
                <div class="cam-label"><span class="record-dot">●</span> <span id="camText">CAM 01 - WARD A</span></div>
                
                <div class="patient-display" id="patientEntity">🐶</div>
                <div class="shutter-door" id="shutter"></div>
                
                <div class="sys-msg" id="systemMessage">ACTION LOG</div>
            </div>

            <div class="control-panel">
                <div class="cam-buttons">
                    <button class="cam-btn active-cam" id="btnCam1" onclick="switchCamera(1)">CAM 1</button>
                    <button class="cam-btn" id="btnCam2" onclick="switchCamera(2)">CAM 2</button>
                </div>

                <button class="action-btn btn-treat" onclick="handleAction('treat')">TREAT PATIENT [T]</button>
                <button class="action-btn btn-shut" onclick="handleAction('shut')">SHUTTER DOOR [E]</button>
                <button class="action-btn" id="btnScanner" onclick="useScanner()" disabled>RUN SCANNER [Space]</button>

                <div class="ref-photo">
                    <div>REFERENCE FILE</div>
                    <div class="ref-emoji" id="referencePhoto">🐶</div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // --- GAME STATE ---
        let state = {
            credits: 0, night: 1, time: 12, am: true,
            hasScanner: false, scannerCooldown: false,
            currentCam: 1, isGameOver: false, clockInterval: null, anomalyTimeout: null
        };

        // --- ENTITY DATA ---
        const normalAnimals = ["🐶", "🐱", "🐰", "🐹", "🐷"];
        const anomalyFaces = ["🐺", "👹", "💀", "👁️", "🕷️", "🕳️", "🤡"];
        
        let rooms = {
            1: { active: true, isAnomaly: false, baseAnimal: "🐶", currentDisplay: "🐶", type: "none" },
            2: { active: true, isAnomaly: false, baseAnimal: "🐱", currentDisplay: "🐱", type: "none" }
        };

        // --- DOM ELEMENTS ---
        const ui = {
            screens: document.querySelectorAll('.screen'),
            time: document.getElementById('hudTime'),
            night: document.getElementById('hudNight'),
            credits: document.getElementById('hudCredits'),
            shopCredits: document.getElementById('shopCredits'),
            patient: document.getElementById('patientEntity'),
            camText: document.getElementById('camText'),
            shutter: document.getElementById('shutter'),
            camView: document.getElementById('camView'),
            refPhoto: document.getElementById('referencePhoto'),
            sysMsg: document.getElementById('systemMessage'),
            btnCam1: document.getElementById('btnCam1'),
            btnCam2: document.getElementById('btnCam2'),
            btnScanner: document.getElementById('btnScanner')
        };

        // --- NAVIGATION ---
        function switchScreen(screenId) {
            ui.screens.forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            if(screenId === 'shopMenu') ui.shopCredits.innerText = state.credits;
        }

        function buyItem(item, cost) {
            const msg = document.getElementById('shopMsg');
            if (state.credits >= cost) {
                state.credits -= cost;
                ui.shopCredits.innerText = state.credits;
                if (item === 'scanner') { state.hasScanner = true; document.getElementById('btnBuyScanner').disabled = true; }
                msg.innerText = "Purchase successful.";
                msg.style.color = "var(--crt-green)";
            } else {
                msg.innerText = "Insufficient Credits.";
                msg.style.color = "red";
            }
        }

        // --- CORE LOOP ---
        function startGame() {
            state.time = 12; state.am = true; state.isGameOver = false;
            ui.night.innerText = `NIGHT: ${state.night}`;
            ui.credits.innerText = `CREDITS: ${state.credits} CR`;
            ui.btnScanner.disabled = !state.hasScanner;
            
            generateRooms();
            switchScreen('gameScreen');
            updateDisplay();
            
            // Start clock (1 in-game hour = 10 real seconds)
            clearInterval(state.clockInterval);
            state.clockInterval = setInterval(advanceTime, 10000);

            // Start Anomaly AI
            scheduleAnomaly();
        }

        function advanceTime() {
            if(state.isGameOver) return;
            state.time++;
            if (state.time > 12) state.time = 1;
            
            let timeString = state.time + (state.time >= 1 && state.time <= 5 ? " AM" : (state.time === 12 ? " AM" : " PM"));
            ui.time.innerText = timeString;

            if (state.time === 6) winNight();
        }

        // --- ANOMALY AI ---
        function scheduleAnomaly() {
            if(state.isGameOver) return;
            clearTimeout(state.anomalyTimeout);
            
            // Random delay between 4s and 10s (gets faster on later nights)
            let delay = Math.random() * (10000 - (state.night * 1000)) + 4000;
            state.anomalyTimeout = setTimeout(triggerAnomaly, delay);
        }

        function triggerAnomaly() {
            if(state.isGameOver) return;
            
            // Pick random room
            let targetRoom = Math.floor(Math.random() * 2) + 1;
            let room = rooms[targetRoom];

            // 60% chance to spawn anomaly if room is normal
            if (!room.isAnomaly && Math.random() > 0.4) {
                room.isAnomaly = true;
                
                let anomalyType = Math.floor(Math.random() * 3);
                if (anomalyType === 0) {
                    room.currentDisplay = anomalyFaces[Math.floor(Math.random() * anomalyFaces.length)];
                    room.type = "face";
                } else if (anomalyType === 1) {
                    room.type = "twitch";
                } else {
                    room.type = "flicker";
                }

                // If anomaly isn't dealt with in 8 seconds, you die
                room.killTimer = setTimeout(() => { gameOver("An anomaly breached your defenses."); }, 8000 - (state.night * 500));
            }
            
            updateDisplay();
            scheduleAnomaly(); // Queue next event
        }

        function generateRooms() {
            rooms[1].baseAnimal = normalAnimals[Math.floor(Math.random() * normalAnimals.length)];
            rooms[1].currentDisplay = rooms[1].baseAnimal;
            rooms[1].isAnomaly = false; rooms[1].type = "none";
            clearTimeout(rooms[1].killTimer);

            rooms[2].baseAnimal = normalAnimals[Math.floor(Math.random() * normalAnimals.length)];
            rooms[2].currentDisplay = rooms[2].baseAnimal;
            rooms[2].isAnomaly = false; rooms[2].type = "none";
            clearTimeout(rooms[2].killTimer);
        }

        // --- CAMERA & UI UPDATES ---
        function switchCamera(camId) {
            state.currentCam = camId;
            ui.btnCam1.classList.toggle('active-cam', camId === 1);
            ui.btnCam2.classList.toggle('active-cam', camId === 2);
            ui.camText.innerText = camId === 1 ? "CAM 01 - WARD A" : "CAM 02 - WARD B";
            updateDisplay();
        }

        function updateDisplay() {
            let room = rooms[state.currentCam];
            
            // Reset visual effects
            ui.patient.className = "patient-display";
            ui.camView.classList.remove("anim-flicker");

            // Apply room state
            ui.patient.innerText = room.currentDisplay;
            ui.refPhoto.innerText = room.baseAnimal;

            if (room.isAnomaly) {
                if (room.type === "twitch") ui.patient.classList.add("anim-twitch");
                if (room.type === "flicker") ui.camView.classList.add("anim-flicker");
            }
        }

        // --- ACTIONS ---
        function handleAction(action) {
            let room = rooms[state.currentCam];
            
            if (action === 'shut') {
                triggerShutter();
                if (room.isAnomaly) {
                    showSystemMsg("ANOMALY PURGED +20CR", "var(--crt-green)");
                    state.credits += 20;
                    resetRoom(state.currentCam);
                } else {
                    gameOver("You crushed a healthy animal. You are fired.");
                }
            } 
            else if (action === 'treat') {
                if (!room.isAnomaly) {
                    showSystemMsg("PATIENT TREATED +10CR", "var(--crt-green)");
                    state.credits += 10;
                    resetRoom(state.currentCam);
                } else {
                    gameOver("You opened the cage to an anomaly. It attacked.");
                }
            }
            ui.credits.innerText = `CREDITS: ${state.credits} CR`;
        }

        function resetRoom(camId) {
            let room = rooms[camId];
            clearTimeout(room.killTimer);
            room.isAnomaly = false;
            room.type = "none";
            room.baseAnimal = normalAnimals[Math.floor(Math.random() * normalAnimals.length)];
            room.currentDisplay = room.baseAnimal;
            
            // Give a 1-second delay before updating screen so they see the shutter
            setTimeout(updateDisplay, 1000);
        }

        function triggerShutter() {
            ui.shutter.classList.add("closed");
            setTimeout(() => ui.shutter.classList.remove("closed"), 1500);
        }

        function useScanner() {
            if (state.scannerCooldown) return;
            state.scannerCooldown = true;
            ui.btnScanner.disabled = true;
            
            let anomalyFound = (rooms[1].isAnomaly || rooms[2].isAnomaly);
            showSystemMsg(anomalyFound ? "WARNING: ANOMALY DETECTED" : "SYSTEM CLEAR", anomalyFound ? "red" : "var(--crt-green)");
            
            setTimeout(() => { 
                state.scannerCooldown = false; 
                if(state.hasScanner) ui.btnScanner.disabled = false; 
            }, 5000);
        }

        function showSystemMsg(text, color) {
            ui.sysMsg.innerText = text;
            ui.sysMsg.style.color = color;
            ui.sysMsg.style.display = "block";
            setTimeout(() => ui.sysMsg.style.display = "none", 2000);
        }

        // --- GAME OVER / WIN ---
        function winNight() {
            state.isGameOver = true;
            clearInterval(state.clockInterval);
            clearTimeout(state.anomalyTimeout);
            alert(`6:00 AM - NIGHT ${state.night} SURVIVED!\n\nCredits Earned: ${state.credits}`);
            state.night++;
            switchScreen('mainMenu');
        }

        function gameOver(reason) {
            state.isGameOver = true;
            clearInterval(state.clockInterval);
            clearTimeout(state.anomalyTimeout);
            alert(`GAME OVER\n\n${reason}\n\nYou survived until ${ui.time.innerText} on Night ${state.night}.`);
            switchScreen('mainMenu');
        }

        // --- KEYBOARD BINDS ---
        document.addEventListener('keydown', (e) => {
            if (!document.getElementById('gameScreen').classList.contains('active') || state.isGameOver) return;
            const key = e.key.toLowerCase();
            
            if (key === '1') switchCamera(1);
            if (key === '2') switchCamera(2);
            if (key === 't') handleAction('treat');
            if (key === 'e') handleAction('shut');
            if (key === ' ' && state.hasScanner) { e.preventDefault(); useScanner(); }
        });

    </script>
</body>
</html>
